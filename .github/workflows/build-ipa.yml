# ============================================================
# iDex 云端编译流水线 v2 —— 在 GitHub 的 macOS 机器上编出 .ipa
#
# v1 的 run #1 结果：镜像 xcode-27 ✓、Xcode 27.1 ✓、iOS 27 SDK ✓、xcodebuild -list ✓
# 只有「编译」那一步秒退 exit code 64（= xcodebuild 的 usage 错误，不是编译报错）。
# v2 改动：去掉命令续行符、把 -sdk 从必选改成可退让、并把编译拆成三次尝试。
# ============================================================
name: Build iDex IPA

on:
  workflow_dispatch:

jobs:
  build:
    # 关键：必须用这个 preview 镜像。截止 2026-10，GitHub 的正式镜像
    # （macos-latest / macos-26）最高只到 Xcode 26.6，编不了 iOS 27；
    # xcode-27 镜像（macOS 27.0.1 arm64）默认就带 Xcode 27.1 + iphoneos27.1 SDK。
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 列出镜像里自带的 Xcode
        run: ls -1 /Applications | grep '^Xcode' || true

      - name: 选一个带 iOS 27 SDK 的 Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
          xcodebuild -version
          echo "xcode-select -p = $(xcode-select -p)"
          echo "which xcodebuild = $(command -v xcodebuild)"
          SDKVER=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' | tail -1)
          echo "iPhoneOS SDK = ${SDKVER:-<无>}"
          if [ -z "${SDKVER:-}" ] || [ "${SDKVER%%.*}" -lt 27 ]; then
            echo "::error::这个运行器上最高只有 iOS ${SDKVER:-?} SDK，而 iDex 要用 iOS 27 SDK 编译。请改用装有 Xcode 27.1 的 Mac（自己的或云端租的），或者向作者索要 TestFlight 构建。"
            exit 1
          fi

      - name: 看清工程结构
        run: xcodebuild -list -project iDex.xcodeproj

      - name: 编译（不签名）
        # 用 -target 而不是 README 里的 -scheme：作者没有提交共享 scheme 文件，
        # 全新 clone 出来的机器上 -scheme iDex 会报 scheme not found。
        run: |
          set -euo pipefail
          DD="$RUNNER_TEMP/dd"

          echo "=== 尝试 1：-target，不显式指定 -sdk（沿用工程里的 SDKROOT=iphoneos）==="
          if xcodebuild -project iDex.xcodeproj -target iDex -configuration Release -derivedDataPath "$DD" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build; then
            echo "BUILD_OK attempt=1"; exit 0
          fi

          echo "=== 尝试 2：-target + 显式 -sdk iphoneos ==="
          if xcodebuild -project iDex.xcodeproj -target iDex -configuration Release -sdk iphoneos -derivedDataPath "$DD" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build; then
            echo "BUILD_OK attempt=2"; exit 0
          fi

          echo "=== 尝试 3：现场生成共享 scheme，改用 -scheme + -destination ==="
          SCHEME_DIR=iDex.xcodeproj/xcshareddata/xcschemes
          mkdir -p "$SCHEME_DIR"
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><Scheme LastUpgradeVersion="2710" version="1.7"><BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES"><BuildActionEntries><BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES"><BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="007BF022308C7972002CDCE2" BuildableName="iDex.app" BlueprintName="iDex" ReferencedContainer="container:iDex.xcodeproj"/></BuildActionEntry></BuildActionEntries></BuildAction></Scheme>' > "$SCHEME_DIR/iDex.xcscheme"
          xcodebuild -project iDex.xcodeproj -scheme iDex -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$DD" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          echo "BUILD_OK attempt=3"

      - name: 打包成 .ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/iDex.app"
          if [ ! -d "$APP" ]; then
            echo "::error::没找到编译产物 iDex.app，实际产物如下："
            ls -R "$RUNNER_TEMP/dd/Build/Products" || true
            exit 1
          fi
          rm -rf Payload iDex-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry iDex-unsigned.ipa Payload
          ls -lh iDex-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: iDex-unsigned-ipa
          path: iDex-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
